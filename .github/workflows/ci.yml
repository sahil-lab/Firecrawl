name: Firecrawl skeleton

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firecrawl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Verify isolated local stack
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Show service status and logs
        if: always()
        run: |
          docker compose -p firecrawl -f infra/docker/compose.yaml ps
          docker compose -p firecrawl -f infra/docker/compose.yaml logs --no-color --tail 100
      - name: Stop only this project's stack
        if: always()
        run: docker compose -p firecrawl -f infra/docker/compose.yaml down
