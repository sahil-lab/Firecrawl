openapi: 3.0.3
info:
  title: Adaptive crawler Phase 1 API
  version: 0.1.0
  description: >
    Original independent prototype. Validation only: no target fetch, permission
    enforcement, persistence, or crawl execution. Future crawl-job CRUD is not
    implemented.
servers:
  - url: http://localhost:18101/api
paths:
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      summary: Process liveness
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Unhealthy'
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: Readiness requiring PostgreSQL and migration V1
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          $ref: '#/components/responses/Unhealthy'
  /crawl-jobs/validate:
    post:
      operationId: validateCrawlRequest
      summary: Validate a candidate without creating a job or fetching a target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrawlValidationRequest'
      responses:
        '200':
          description: Valid input; execution remains disabled
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [valid, executionEnabled]
                properties:
                  valid:
                    type: boolean
                    enum: [true]
                  executionEnabled:
                    type: boolean
                    enum: [false]
        '400':
          description: Invalid fields or malformed/unknown/coerced input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request exceeds the local proxy's 8 KiB body limit
        '415':
          description: Unsupported media type; send application/json
components:
  schemas:
    CrawlValidationRequest:
      type: object
      additionalProperties: false
      required: [url, maxPages, termsAccepted]
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: Absolute HTTP(S) URL, ASCII hostname, no credentials/fragment; no DNS safety claim.
          example: https://example.test/articles
        maxPages:
          type: integer
          minimum: 1
          maximum: 100
          example: 10
        termsAccepted:
          type: boolean
          enum: [true]
          description: Acknowledgment, not verified site permission or policy enforcement.
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    Healthy:
      description: Healthy, without sensitive component details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    Unhealthy:
      description: Unhealthy; investigate project-scoped service logs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
